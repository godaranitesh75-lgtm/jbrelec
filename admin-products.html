<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Manager</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', sans-serif; background: #f4f8f6; color: #0f3d3a; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2eaed; box-shadow: 0 4px 20px rgba(7,89,76,.06); margin-bottom: 20px; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    label { display: block; font-size: 12px; font-weight: 700; margin: 10px 0 6px; color: #3d5260; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #dce6e8; border-radius: 8px; background: #f8fbfa; color: #0f3d3a; font-size: 13px; outline: none; }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #0d9488; color: white; font-weight: 800; font-size: 13px; cursor: pointer; }
    button.secondary { background: #e2eaed; color: #0f3d3a; }
    button.danger { background: #e11d48; }
    .status { margin-top: 10px; font-size: 13px; color: #3d5260; }
    .error { color: #e11d48; }
    .success { color: #065f46; }
    .product-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: #f8fbfa; border: 1px solid #e2eaed; border-radius: 10px; }
    .product-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #e2eaed; }
    .product-item .meta { font-size: 12px; color: #6b7f8c; }
    .hidden { display: none; }
    .image-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #e2eaed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="loginCard">
      <h1>Admin Login</h1>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Enter email" />
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password" />
      <div class="actions">
        <button onclick="login()">Login</button>
      </div>
      <div class="status" id="loginStatus"></div>
    </div>

    <div class="card hidden" id="adminPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h1 style="margin: 0;">Admin Panel</h1>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
      <div class="status" id="authNotice"></div>

      <hr style="border: none; border-top: 1px solid #e2eaed; margin: 20px 0;" />

      <h2>Change Password</h2>
      <div class="row">
        <div><label>Current Password</label><input id="currentPassword" type="password" /></div>
        <div><label>New Password</label><input id="newPassword" type="password" /></div>
      </div>
      <label>Confirm New Password</label>
      <input id="confirmPassword" type="password" />
      <div class="actions"><button onclick="changePassword()">Change Password</button></div>
      <div class="status" id="passwordStatus"></div>

      <hr style="border: none; border-top: 1px solid #e2eaed; margin: 20px 0;" />

      <h2>Categories</h2>
      <div class="row">
        <div><label>Category Name</label><input id="categoryName" placeholder="e.g. Switches & Sockets" /></div>
        <div style="display: flex; align-items: flex-end;"><button onclick="submitCategory()">Add Category</button></div>
      </div>
      <div class="status" id="categoryStatus"></div>
      <div id="categoryList" style="margin-top: 12px;"></div>

      <hr style="border: none; border-top: 1px solid #e2eaed; margin: 20px 0;" />

      <h2>Add/Edit Product</h2>
      <input type="hidden" id="productId" value="" />
      <div class="row">
        <div><label>Product Name *</label><input id="name" /></div>
        <div><label>SKU *</label><input id="sku" /></div>
      </div>
      <div class="row">
        <div><label>Category *</label><select id="categoryId"><option value="">Select category</option></select></div>
        <div><label>Brand</label><select id="brandId"><option value="">-- Select brand --</option></select></div>
      </div>
      <label>Description</label><textarea id="description"></textarea>
      <div class="row">
        <div><label>Price (₹) *</label><input id="price" type="number" /></div>
        <div><label>Sale Price (₹)</label><input id="salePrice" type="number" /></div>
      </div>
      <div class="row">
        <div><label>Stock *</label><input id="stock" type="number" /></div>
        <div><label>Specifications (JSON)</label><input id="specifications" placeholder='{"size":"1.5 sqmm"}' /></div>
      </div>
      <label>Images</label>
      <input type="file" id="images" accept="image/*" multiple />
      <div class="image-preview" id="imagePreview"></div>
      <div class="actions">
        <button onclick="submitProduct()" id="productSubmitBtn">Save Product</button>
        <button class="secondary" onclick="resetForm()">Reset</button>
      </div>
      <div class="status" id="status"></div>

      <hr style="border: none; border-top: 1px solid #e2eaed; margin: 20px 0;" />

      <h2>Products</h2>
      <div class="product-list" id="productList">Loading...</div>

      <hr style="border: none; border-top: 1px solid #e2eaed; margin: 20px 0;" />

      <h2>Brands</h2>
      <div class="row">
        <div><label>Brand Name</label><input id="brandName" /></div>
        <div style="display: flex; align-items: flex-end;"><button onclick="submitBrand()">Add Brand</button></div>
      </div>
      <div class="status" id="brandStatus"></div>
      <div id="brandList" style="margin-top: 12px;"></div>
    </div>
  </div>

  <script>
    const API_BASE = (() => {
      const hostname = window.location.hostname;
      if (window.location.protocol === 'file:' || hostname === 'localhost' || hostname === '127.0.0.1' || hostname.endsWith('.local')) {
        return 'http://localhost:4000/api';
      }
      return '/api';
    })();
    let token = localStorage.getItem('jbr_token') || localStorage.getItem('admin_token');
    let uploadedImages = [];
    let currentProducts = [];

    function showAdmin() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('authNotice').innerHTML = token ? '' : '<span class="error">No token found.</span>';
      loadCategories(); loadBrands(); loadProducts(); loadBrandList();
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('loginStatus');
      status.className = 'status';
      status.textContent = 'Logging in...';
      try {
        const res = await fetch(API_BASE + '/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
        const data = await res.json();
        if (!res.ok) { status.className = 'status error'; status.textContent = data.message || 'Failed'; return; }
        token = data.token;
        localStorage.setItem('jbr_token', token);
        status.className = 'status success'; status.textContent = 'Success';
        setTimeout(() => showAdmin(), 200);
      } catch (err) { status.className = 'status error'; status.textContent = 'Error: ' + err.message; }
    }

    function logout() { localStorage.removeItem('jbr_token'); localStorage.removeItem('admin_token'); location.reload(); }

    async function changePassword() {
      const status = document.getElementById('passwordStatus');
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (!currentPassword || !newPassword || !confirmPassword) { status.className = 'status error'; status.textContent = 'All fields required'; return; }
      if (newPassword !== confirmPassword) { status.className = 'status error'; status.textContent = 'Passwords do not match'; return; }
      try {
        const res = await fetch(API_BASE + '/account/password', { method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + token}, body: JSON.stringify({currentPassword, newPassword}) });
        const data = await res.json();
        status.className = res.ok ? 'status success' : 'status error';
        status.textContent = data.message || (res.ok ? 'Success' : 'Failed');
        if (res.ok) { document.getElementById('currentPassword').value = ''; document.getElementById('newPassword').value = ''; document.getElementById('confirmPassword').value = ''; }
      } catch { status.className = 'status error'; status.textContent = 'Error'; }
    }

    async function loadCategories() {
      try {
        const res = await fetch(API_BASE + '/products/categories');
        const data = await res.json();
        const categories = data.categories || [];
        const select = document.getElementById('categoryId');
        select.innerHTML = '<option value="">Select category</option>' + categories.map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join('');
        const list = document.getElementById('categoryList');
        list.innerHTML = categories.map(c => '<div style="display: flex; justify-content: space-between; padding: 6px 10px; background: #f8fbfa; border-radius: 6px;"><span>' + escapeHtml(c.name) + '</span><button class="danger" style="padding: 2px 8px; font-size: 11px;" onclick="deleteCategory(\'' + c.id + '\')">Delete</button></div>').join('');
      } catch {}
    }

    async function submitCategory() {
      const name = document.getElementById('categoryName').value.trim();
      if (!name) return;
      const status = document.getElementById('categoryStatus');
      try {
        const res = await fetch(API_BASE + '/products/categories', { method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + token}, body: JSON.stringify({name}) });
        const data = await res.json();
        status.className = res.ok ? 'status success' : 'status error';
        status.textContent = res.ok ? 'Added' : (data.message || 'Failed');
        if (res.ok) { document.getElementById('categoryName').value = ''; loadCategories(); }
      } catch { status.className = 'status error'; status.textContent = 'Error'; }
    }

    async function deleteCategory(id) {
      if (!confirm('Delete?')) return;
      try { const res = await fetch(API_BASE + '/products/categories/' + id, { method: 'DELETE', headers: {Authorization: 'Bearer ' + token} }); if (res.ok) loadCategories(); } catch {}
    }

    async function loadBrands() {
      try {
        const res = await fetch(API_BASE + '/products/brands');
        const data = await res.json();
        const brands = data.brands || [];
        const select = document.getElementById('brandId');
        select.innerHTML = '<option value="">-- Select brand --</option>' + brands.map(b => '<option value="' + b.id + '">' + escapeHtml(b.name) + '</option>').join('');
      } catch {}
    }

    async function loadBrandList() {
      try {
        const res = await fetch(API_BASE + '/products/brands');
        const data = await res.json();
        const brands = data.brands || [];
        const list = document.getElementById('brandList');
        list.innerHTML = brands.map(b => '<div style="display: flex; justify-content: space-between; padding: 6px 10px; background: #f8fbfa; border-radius: 6px;"><span>' + escapeHtml(b.name) + '</span><button class="danger" style="padding: 2px 8px; font-size: 11px;" onclick="deleteBrand(\'' + b.id + '\')">Delete</button></div>').join('');
      } catch {}
    }

    async function submitBrand() {
      const name = document.getElementById('brandName').value.trim();
      if (!name) return;
      const status = document.getElementById('brandStatus');
      try {
        const res = await fetch(API_BASE + '/products/brands', { method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + token}, body: JSON.stringify({name}) });
        const data = await res.json();
        status.className = res.ok ? 'status success' : 'status error';
        status.textContent = res.ok ? 'Added' : (data.message || 'Failed');
        if (res.ok) { document.getElementById('brandName').value = ''; loadBrands(); loadBrandList(); }
      } catch { status.className = 'status error'; status.textContent = 'Error'; }
    }

    async function deleteBrand(id) {
      if (!confirm('Delete?')) return;
      try { const res = await fetch(API_BASE + '/products/brands/' + id, { method: 'DELETE', headers: {Authorization: 'Bearer ' + token} }); if (res.ok) { loadBrands(); loadBrandList(); } } catch {}
    }

    document.getElementById('images').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      uploadedImages = [];
      const preview = document.getElementById('imagePreview');
      preview.innerHTML = '';
      for (const file of files.slice(0, 5)) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          uploadedImages.push(ev.target.result);
          const img = document.createElement('img'); img.src = ev.target.result; preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      }
    });

    async function loadProducts() {
      const list = document.getElementById('productList');
      list.innerHTML = 'Loading...';
      try {
        const res = await fetch(API_BASE + '/products?limit=3000');
        const data = await res.json();
        currentProducts = data.products || [];
        if (currentProducts.length === 0) { list.innerHTML = 'No products'; return; }
        list.innerHTML = currentProducts.map(p => '<div class="product-item"><div><div style="font-weight: 700;">' + escapeHtml(p.name) + '</div><div class="meta">SKU: ' + escapeHtml(p.sku) + ' | ₹' + p.price + ' | Stock: ' + p.stock + '</div></div><div style="display: flex; gap: 6px;"><button style="padding: 4px 10px; font-size: 12px;" onclick="editProduct(\'' + p.id + '\')">Edit</button><button class="danger" style="padding: 4px 10px; font-size: 12px;" onclick="deleteProduct(\'' + p.id + '\')">Delete</button></div></div>').join('');
      } catch { list.innerHTML = '<span class="error">Failed</span>'; }
    }

    function editProduct(id) {
      const p = currentProducts.find(x => x.id === id);
      if (!p) return;
      document.getElementById('productId').value = p.id;
      document.getElementById('name').value = p.name || '';
      document.getElementById('sku').value = p.sku || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('price').value = p.price || '';
      document.getElementById('salePrice').value = p.salePrice || '';
      document.getElementById('stock').value = p.stock || '';
      document.getElementById('specifications').value = p.specifications ? JSON.stringify(p.specifications) : '';
      document.getElementById('categoryId').value = p.categoryId || '';
      if (p.brandId) document.getElementById('brandId').value = p.brandId;
      uploadedImages = p.images || [];
      const preview = document.getElementById('imagePreview');
      preview.innerHTML = uploadedImages.map(img => '<img src="' + img + '" />').join('');
      document.getElementById('productSubmitBtn').textContent = 'Update Product';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function submitProduct() {
      const status = document.getElementById('status');
      const productId = document.getElementById('productId').value;
      const isEdit = !!productId;
      const name = document.getElementById('name').value.trim();
      const sku = document.getElementById('sku').value.trim();
      const categoryId = document.getElementById('categoryId').value;
      const price = document.getElementById('price').value;
      const stock = document.getElementById('stock').value;
      const specifications = document.getElementById('specifications').value.trim();
      if (!name || !sku || !categoryId || price === '' || stock === '') { status.className = 'status error'; status.textContent = 'Required fields missing'; return; }
      if (specifications) { try { JSON.parse(specifications); } catch { status.className = 'status error'; status.textContent = 'Invalid JSON'; return; } }
      const slugBase = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'product';
      const payload = { name, sku, slug: slugBase + '-' + Date.now(), categoryId, brandId: document.getElementById('brandId').value || null, description: document.getElementById('description').value, price: Number(price), salePrice: document.getElementById('salePrice').value ? Number(document.getElementById('salePrice').value) : undefined, stock: Number(stock), images: uploadedImages, specifications: specifications || undefined, status: 'ACTIVE' };
      try {
        const url = isEdit ? API_BASE + '/products/' + productId : API_BASE + '/products';
        const method = isEdit ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + token}, body: JSON.stringify(payload) });
        const data = await res.json();
        status.className = res.ok ? 'status success' : 'status error';
        status.textContent = res.ok ? (isEdit ? 'Updated' : 'Created') : (data.message || 'Failed');
        if (res.ok) { resetForm(); loadProducts(); }
      } catch { status.className = 'status error'; status.textContent = 'Error'; }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete?')) return;
      try { const res = await fetch(API_BASE + '/products/' + id, { method: 'DELETE', headers: {Authorization: 'Bearer ' + token} }); if (res.ok) loadProducts(); } catch {}
    }

    function resetForm() {
      document.getElementById('productId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('sku').value = '';
      document.getElementById('description').value = '';
      document.getElementById('price').value = '';
      document.getElementById('salePrice').value = '';
      document.getElementById('stock').value = '';
      document.getElementById('specifications').value = '';
      document.getElementById('categoryId').value = '';
      document.getElementById('brandId').value = '';
      uploadedImages = [];
      document.getElementById('imagePreview').innerHTML = '';
      document.getElementById('images').value = '';
      document.getElementById('productSubmitBtn').textContent = 'Save Product';
      document.getElementById('status').textContent = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    if (token) {
      showAdmin();
    } else {
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('adminPanel').classList.add('hidden');
    }
  </script>
</body>
</html>
